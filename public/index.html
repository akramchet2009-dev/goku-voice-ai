<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Goku Voice AI</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0b0f;
      color: white;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
    }

    .title {
      text-align: center;
      margin-top: 20px;
      margin-bottom: 30px;
    }

    .title h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .title p {
      color: #aaa;
      margin: 0;
    }

    .card {
      background: #15151c;
      border: 1px solid #292934;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      height: 180px;
      resize: vertical;
      border: none;
      outline: none;
      border-radius: 12px;
      padding: 15px;
      background: #0d0d12;
      color: white;
      font-size: 17px;
      line-height: 1.6;
    }

    textarea::placeholder {
      color: #666;
    }

    select {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #292934;
      background: #0d0d12;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input[type="file"] {
      width: 100%;
      padding: 12px;
      background: #0d0d12;
      color: #ccc;
      border-radius: 12px;
      border: 1px solid #292934;
    }

    .generate {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: #ff7a00;
      color: white;
      margin-top: 10px;
    }

    .generate:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .generate:active {
      transform: scale(0.98);
    }

    .status {
      text-align: center;
      margin-top: 15px;
      color: #aaa;
      min-height: 24px;
      line-height: 1.5;
    }

    .audio-box {
      display: none;
      margin-top: 20px;
    }

    audio {
      width: 100%;
    }

    .download {
      display: block;
      text-align: center;
      margin-top: 12px;
      padding: 12px;
      border-radius: 12px;
      background: #24242e;
      color: white;
      text-decoration: none;
    }

    .note {
      color: #777;
      font-size: 13px;
      margin-top: 10px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="title">
      <h1>🎙️ Goku Voice AI</h1>
      <p>تحويل النص إلى صوت بالذكاء الاصطناعي</p>
    </div>

    <!-- النص -->
    <div class="card">
      <label for="text">📝 النص</label>

      <textarea
        id="text"
        placeholder="اكتب النص الذي تريد تحويله إلى صوت هنا..."
      ></textarea>
    </div>

    <!-- اللغة -->
    <div class="card">
      <label for="language">🌐 اللغة</label>

      <select id="language">
        <option value="ar">🇲🇦 العربية</option>
        <option value="en" selected>🇺🇸 English</option>
        <option value="ja">🇯🇵 日本語</option>
      </select>

      <div class="note">
        اختر اللغة التي تريد أن يتحدث بها الصوت.
      </div>
    </div>

    <!-- الصوت -->
    <div class="card">
      <label for="voice">🎤 عينة الصوت</label>

      <input
        id="voice"
        type="file"
        accept="audio/*"
      >

      <div class="note">
        اختر عينة صوتية تملك حق استخدامها.
        يفضل استخدام عينة واضحة وبدون موسيقى أو ضوضاء قوية.
      </div>
    </div>

    <!-- التوليد -->
    <div class="card">

      <button
        id="generateButton"
        class="generate"
        onclick="generateVoice()"
      >
        🔊 توليد الصوت
      </button>

      <div id="status" class="status"></div>

      <div id="audioBox" class="audio-box">

        <audio id="audioPlayer" controls></audio>

        <a
          id="downloadButton"
          class="download"
          download="goku-voice.wav"
        >
          💾 حفظ الصوت
        </a>

      </div>

    </div>

  </div>


  <script>

    async function generateVoice() {

      const text =
        document.getElementById("text").value.trim();

      const language =
        document.getElementById("language").value;

      const voice =
        document.getElementById("voice").files[0];

      const status =
        document.getElementById("status");

      const audioBox =
        document.getElementById("audioBox");

      const audioPlayer =
        document.getElementById("audioPlayer");

      const downloadButton =
        document.getElementById("downloadButton");

      const generateButton =
        document.getElementById("generateButton");


      // التحقق من النص
      if (!text) {

        status.textContent =
          "⚠️ اكتب نصًا أولًا.";

        return;
      }


      // التحقق من عينة الصوت
      if (!voice) {

        status.textContent =
          "⚠️ اختر عينة صوتية أولًا.";

        return;
      }


      // بدء التوليد
      generateButton.disabled = true;

      generateButton.textContent =
        "⏳ جاري التوليد...";

      status.textContent =
        "⏳ يتم إنشاء الصوت، انتظر قليلًا...";

      audioBox.style.display = "none";


      try {

        const formData = new FormData();

        formData.append("text", text);

        formData.append("language", language);

        formData.append("voice", voice);


        const response = await fetch(
          "/api/generate",
          {
            method: "POST",
            body: formData
          }
        );


        if (!response.ok) {

          let message =
            "حدث خطأ أثناء توليد الصوت.";

          try {

            const error =
              await response.json();

            if (error.error) {
              message = error.error;
            }

          } catch (_) {}

          throw new Error(message);
        }


        // الحصول على ملف الصوت
        const audioBlob =
          await response.blob();


        const audioURL =
          URL.createObjectURL(audioBlob);


        // تشغيل الصوت
        audioPlayer.src =
          audioURL;


        // زر الحفظ
        downloadButton.href =
          audioURL;


        audioBox.style.display =
          "block";


        status.textContent =
          "✅ تم إنشاء الصوت بنجاح!";


      } catch (error) {

        console.error(error);

        status.textContent =
          "❌ " + error.message;

      } finally {

        generateButton.disabled =
          false;

        generateButton.textContent =
          "🔊 توليد الصوت";
      }

    }

  </script>

</body>
</html>
