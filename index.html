<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Goku Voice AI</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0b0f;
      color: white;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
    }

    .title {
      text-align: center;
      margin-top: 20px;
      margin-bottom: 30px;
    }

    .title h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .title p {
      color: #aaa;
      margin: 0;
    }

    .card {
      background: #15151c;
      border: 1px solid #292934;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      height: 180px;
      resize: vertical;
      border: none;
      outline: none;
      border-radius: 12px;
      padding: 15px;
      background: #0d0d12;
      color: white;
      font-size: 17px;
      line-height: 1.6;
    }

    textarea::placeholder {
      color: #666;
    }

    input[type="file"] {
      width: 100%;
      padding: 12px;
      background: #0d0d12;
      color: #ccc;
      border-radius: 12px;
      border: 1px solid #292934;
    }

    .generate {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: #ff7a00;
      color: white;
      margin-top: 10px;
    }

    .generate:active {
      transform: scale(0.98);
    }

    .status {
      text-align: center;
      margin-top: 15px;
      color: #aaa;
      min-height: 24px;
    }

    .audio-box {
      display: none;
      margin-top: 20px;
    }

    audio {
      width: 100%;
    }

    .note {
      color: #777;
      font-size: 13px;
      margin-top: 10px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="title">
      <h1>🎙️ Goku Voice AI</h1>
      <p>تحويل النص إلى صوت</p>
    </div>

    <div class="card">

      <label for="text">📝 اكتب النص</label>

      <textarea
        id="text"
        placeholder="اكتب النص الذي تريد تحويله إلى صوت هنا..."
      ></textarea>

    </div>

    <div class="card">

      <label for="voice">🎤 عينة الصوت</label>

      <input
        id="voice"
        type="file"
        accept="audio/*"
      >

      <div class="note">
        اختر عينة صوتية تملك حق استخدامها.
        سنجعل رفع العينة مرة واحدة فقط في النسخة النهائية.
      </div>

    </div>

    <div class="card">

      <button class="generate" onclick="generateVoice()">
        🔊 توليد الصوت
      </button>

      <div id="status" class="status"></div>

      <div id="audioBox" class="audio-box">
        <audio id="audioPlayer" controls></audio>
      </div>

    </div>

  </div>

  <script>

    async function generateVoice() {

      const text = document.getElementById("text").value.trim();
      const voice = document.getElementById("voice").files[0];
      const status = document.getElementById("status");
      const audioBox = document.getElementById("audioBox");
      const audioPlayer = document.getElementById("audioPlayer");

      if (!text) {
        status.textContent = "⚠️ اكتب نصًا أولًا.";
        return;
      }

      if (!voice) {
        status.textContent = "⚠️ اختر عينة صوتية أولًا.";
        return;
      }

      status.textContent = "⏳ جاري توليد الصوت...";
      audioBox.style.display = "none";

      try {

        const formData = new FormData();

        formData.append("text", text);
        formData.append("voice", voice);

        const response = await fetch("/api/generate", {
          method: "POST",
          body: formData
        });

        if (!response.ok) {
          throw new Error("Generation failed");
        }

        const audioBlob = await response.blob();

        const audioURL = URL.createObjectURL(audioBlob);

        audioPlayer.src = audioURL;
        audioBox.style.display = "block";

        status.textContent = "✅ تم إنشاء الصوت!";

      } catch (error) {

        console.error(error);

        status.textContent =
          "❌ لم يعمل التوليد بعد. سنضيف محرك الصوت في الخطوة التالية.";

      }

    }

  </script>

</body>
        </html>
